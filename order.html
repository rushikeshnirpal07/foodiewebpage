<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order Form</title>
    <link rel="icon" type="image/png" href="Food-Logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url(food-back3.jpg); background-size: cover;">

    <div class="login-box">
        <h1>🍴 Foodie</h1>
        <h2>Food Order Form</h2>

        <form action="#">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Select Food</label>
            <select required>
                <option value="">Choose your food</option>
                <option>Cheese Pizza - ₹150</option>
                <option>Classic Burger - ₹100</option>
                <option>Veg Sandwich - ₹80</option>
                <option>Cold Drink - ₹50</option>
            </select>

            <label>Quantity</label>
            <input type="number" min="1" value="1" required>

            <label>Delivery Address</label>
            <textarea placeholder="Enter your address" required></textarea>

            <label>Payment Method</label>
            <select required>
                <option>Cash on Delivery</option>
                <option>UPI</option>
                <option>Card</option>
            </select>

            <button type="submit">Place Order</button>
        </form>

        <a href="index.html" class="back">← Back to Home</a>
    </div>

</body>
</html>
